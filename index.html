<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Vinyl Library</title>
<style>
:root{--bg:#ddd7ca;--strong:#000;--card:#fff;--ink:#1c1a17;--mute:#7a736a;--line:#d0c9bb;--acc:#c0392b;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e0c09;--strong:#f1ece4;--card:#201d18;--ink:#f1ece4;--mute:#a39b8f;--line:#35302a;--acc:#e5604f;--accink:#15130f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.listbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px}
.listbar h1{margin:0 0 10px;font:700 22px/1.2 Georgia,serif;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.listbar h1 small{font:400 13px system-ui,sans-serif;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=search]{flex:1 1 200px;min-width:0}
main{padding:16px;max-width:1300px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.grid h2{grid-column:1/-1;margin:14px 0 0;font:700 18px Georgia,serif;border-bottom:2px solid var(--acc);padding-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cover{aspect-ratio:1;background:var(--line);position:relative;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:40px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:10px}
.t{font-weight:600;overflow-wrap:anywhere}
.a{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.g{font-size:12px;color:var(--acc);margin-top:2px}
.cm{font-size:12px;color:var(--mute);margin-top:4px;font-style:italic;overflow-wrap:anywhere}
.card{cursor:pointer;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);width:min(560px,94vw);max-height:90vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlgin{padding:18px;position:relative}
.x{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;width:32px;height:32px;font-size:18px;cursor:pointer;line-height:1}
.top{display:flex;gap:14px;align-items:flex-start;padding-right:36px}
.big{width:130px;height:130px;flex:none;border-radius:8px;background:var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:44px}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top h3{margin:0 0 4px;font:700 20px/1.2 Georgia,serif;overflow-wrap:anywhere}
.chip{display:inline-block;background:var(--acc);color:var(--accink);font-weight:700;font-size:15px;padding:3px 14px;border-radius:99px;margin-top:6px}
.tl{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.tl h4{margin:0 0 8px;font-size:14px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.tl .disc{margin:10px 0 4px;font-weight:600;font-size:13px}
.trk{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.trk .n{color:var(--mute);width:24px;text-align:right;flex:none}
.trk .nm{flex:1;overflow-wrap:anywhere}
.trk .d{color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.tl .src{font-size:12px;color:var(--mute);margin-top:10px}
.tl a{color:var(--acc)}
.nav{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:14px 20px}
.nav .brand{font:700 18px Georgia,serif;color:var(--ink);text-decoration:none}
.nav .links{display:flex;gap:6px}
.nav .links a{color:var(--mute);text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px}
.nav .links a.on{background:var(--acc);color:var(--accink);font-weight:600}
.hero{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:20px;padding:12vh 0 48px;text-align:center}
.big-title{font:700 clamp(30px,6vw,56px)/1.1 Georgia,serif;color:var(--strong);margin:0;padding:0 16px}
.sub{color:var(--strong);font-size:18px;font-weight:500;margin:0;padding:0 16px}
.marquee{--s:200px;width:100%;overflow:hidden;padding:22px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:scroll 900s linear infinite}
.marquee:hover .track{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tile{flex:none;width:var(--s);height:var(--s);margin-right:18px;border-radius:8px;overflow:hidden;position:relative;background:var(--card);border:1px solid var(--line);cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.28);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;text-align:center}
.tile{display:block;padding:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72;transition:opacity .2s}
.tile:hover img{opacity:1}
.tile .tx{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 10px;background:linear-gradient(transparent,var(--card) 65%);text-align:center}
.tile .tt{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere;color:var(--ink)}
.tile .ta{font-size:12px;color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.tile.noimg .tx{top:0;display:flex;flex-direction:column;justify-content:center;background:none;padding:12px}
.newsec{width:100%;max-width:1100px;padding:10px 16px 0;text-align:center}
.newsec h2{font:700 22px Georgia,serif;color:var(--strong);margin:18px 0 12px}
.newlist{list-style:none;margin:0 auto;padding:0;max-width:520px;text-align:left}
.newlist li{border-bottom:1px solid var(--line)}
.newlist button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;width:100%;padding:11px 4px;cursor:pointer;color:var(--ink)}
.newlist .nt{font-weight:600;overflow-wrap:anywhere}
.newlist .na{color:var(--mute);font-size:13px}
.newlist .nb{margin-left:auto;background:var(--acc);color:var(--accink);font-weight:700;font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap}
.newlist button:hover .nt{color:var(--acc)}
.newlist button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.newnote{color:var(--mute);font-size:13px;margin:14px 0 0}
.ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:0 16px}
button.cta{border:0;font:inherit;font-weight:600;cursor:pointer}
.cta.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.cta.pick{margin-top:16px}
.cta{color:var(--accink);background:var(--acc);text-decoration:none;font-weight:600;padding:10px 20px;border-radius:99px}
@media (max-width:600px){.marquee{--s:150px}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.marquee{overflow-x:auto}}
.empty{text-align:center;color:var(--mute);padding:60px 10px}
.note{font-size:12px;color:var(--mute);text-align:center;padding:24px 0 8px}
.fhint{margin-top:14px;font-size:12px;color:var(--mute);overflow-wrap:anywhere}
a,button,.card,.tile{-webkit-tap-highlight-color:transparent}
.marquee:active .track{animation-play-state:paused}
dialog{max-height:90vh;max-height:90dvh}
@media (max-width:820px){
  input,select{font-size:16px}
  .listbar{padding:12px}
  main{padding:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
  .hero{padding-top:7vh}
}
@media (max-width:600px){
  .listbar{position:static}
  .bar input[type=search]{flex:1 1 100%}
  .bar select{flex:1 1 40%;min-width:0}
  .nav{padding:10px 12px}
  .dlgin{padding:14px}
  .big{width:100px;height:100px}
  .top h3{font-size:18px}
  .ctas .cta{flex:1 1 auto;text-align:center}
}
@media (pointer:coarse){
  .nav .links a{padding:11px 16px}
  .x{width:42px;height:42px}
  .cta{padding:13px 22px}
  .trk{padding:8px 0}
  .newlist button{padding:14px 4px}
}
</style>
</head>

<section id="homeView">
  <div class="hero">
    <h1 class="big-title">Discothèque</h1>

    <section class="newsec" id="newSec" hidden><h2>New additions</h2><ul class="newlist" id="newRow"></ul><p class="newnote" id="newNote"></p></section>
  </div>
</section>

<section id="listView" hidden>
  <header class="listbar">
    <h1>Full list <small id="count"></small></h1>

      <input type="search" id="q" placeholder="Search artist, album, genre, comment…">
      <select id="boxSel"></select>
      <select id="genreSel"></select>
      <select id="sortSel">
        <option value="artist">Sort: artist</option>
        <option value="box">Sort: box</option>
        <option value="title">Sort: album</option>
        <option value="year">Sort: year</option>
      </select>
    </div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No records found.</div>
  </main>
</section>
<div class="note" id="foot"></div>

      records.slice(-15).forEach(function(r){
        if(sheetCover(r)||autoCache[coverKey(r)])return;
        probe(coverFile(r)).then(function(g){if(!g)lookupCover(r)});
      });
    });
  }
  var lastPick=-1;
  function pickRandom(){
    if(!records.length)return;
    var i;do{i=Math.floor(Math.random()*records.length)}while(records.length>1&&i===lastPick);
    lastPick=i;openAlbum(records[i],true);
  }
  $('rndBtn').onclick=pickRandom;
  function route(){
    var list=location.hash==='#list';
    $('homeView').hidden=list;$('listView').hidden=!list;
    $('lnkHome').classList.toggle('on',!list);$('lnkList').classList.toggle('on',list);
    document.title=list?'Full list \u2014 My Vinyl Library':'My Vinyl Library';
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);

  /* ---- Tracklist (looked up live in the browser) ---- */
  function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
  function toks(s){return norm(s).split(' ').filter(Boolean)}
  function score(a,b){
    var x=toks(a),y=toks(b);if(!x.length||!y.length)return 0;
    var inter=x.filter(function(w){return y.indexOf(w)>=0}).length;
    return inter/(x.length+y.length-inter);
  }
  function jsonp(url){
    return new Promise(function(res,rej){
      var cb='cb'+Date.now()+Math.floor(Math.random()*1e6),s=document.createElement('script');
      var timer=setTimeout(function(){done();rej(new Error('timeout'))},12000);
      function done(){clearTimeout(timer);delete window[cb];s.remove()}
      window[cb]=function(d){done();res(d)};
      s.onerror=function(){done();rej(new Error('load'))};
      s.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
      document.head.appendChild(s);
    });
  }
  function itunesBest(r){
    var want=r.artist+' '+r.title;
    return jsonp('https://itunes.apple.com/search?entity=album&limit=8&term='+encodeURIComponent(want)).then(function(d){
      var best=null,bs=0;
      (d.results||[]).forEach(function(c){
        var s=score(want,c.artistName+' '+c.collectionName);
        if(norm(c.collectionName).indexOf(norm(r.title))>=0&&score(r.artist,c.artistName)>0)s+=0.3;
        if(s>bs){bs=s;best=c}
      });
      return (best&&bs>=0.5)?best:null;
    });
  }
  function fromItunes(r){
    return itunesBest(r).then(function(best){
      if(!best)return null;
      return jsonp('https://itunes.apple.com/lookup?entity=song&limit=200&id='+best.collectionId).then(function(d2){
        var tr=(d2.results||[]).filter(function(x){return x.wrapperType==='track'})
          .sort(function(a,b){return (a.discNumber||1)-(b.discNumber||1)||(a.trackNumber||0)-(b.trackNumber||0)})
          .map(function(x){return {disc:x.discNumber||1,no:x.trackNumber,name:x.trackName,ms:x.trackTimeMillis}});
        return tr.length?{tracks:tr,source:'Apple Music',title:best.collectionName}:null;
      });
    });
  }
  function fromMusicBrainz(r){
    var want=r.artist+' '+r.title;
    var q='release:"'+r.title.replace(/"/g,'')+'" AND artist:"'+r.artist.replace(/"/g,'')+'"';
    return fetch('https://musicbrainz.org/ws/2/release/?fmt=json&limit=8&query='+encodeURIComponent(q)).then(function(x){if(!x.ok)throw new Error(x.status);return x.json()}).then(function(d){
      var best=null,bs=0;
      (d.releases||[]).forEach(function(c){
        var credit=(c['artist-credit']||[]).map(function(a){return a.name}).join(' ');
        var s=score(want,credit+' '+c.title);if(s>bs){bs=s;best=c}
      });
      if(!best||bs<0.5)return null;
      return fetch('https://musicbrainz.org/ws/2/release/'+best.id+'?fmt=json&inc=recordings').then(function(x){if(!x.ok)throw new Error(x.status);return x.json()}).then(function(rel){
        var tr=[];
        (rel.media||[]).forEach(function(m,i){(m.tracks||[]).forEach(function(t){tr.push({disc:i+1,no:t.position,name:t.title,ms:t.length})})});
        return tr.length?{tracks:tr,source:'MusicBrainz',title:best.title}:null;
      });
    });
  }
  function getTracks(r){
    var key='tl2:'+norm(r.artist+' '+r.title);
    try{var c=localStorage.getItem(key);if(c)return Promise.resolve(JSON.parse(c))}catch(e){}
    function save(v){if(v){try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}}return v}
    return fromItunes(r).catch(function(){return null}).then(function(v){
      if(v)return save(v);
      return fromMusicBrainz(r).catch(function(){return null}).then(save);
    });
  }
  function fmtMs(ms){if(!ms)return '';var s=Math.round(ms/1000);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}

  var dlg=$('dlg'),openFor=null;
  $('dlgX').onclick=function(){dlg.close()};
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
  function openAlbum(r,rnd){
    openFor=r;var body=$('dlgBody');body.innerHTML='';
    var top=document.createElement('div');top.className='top';
    var big=document.createElement('div');big.className='big';big.textContent='\u25CE';
    var im=document.createElement('img');im.alt='';setCover(im,r,function(){im.remove()},true);big.appendChild(im);
    var info=document.createElement('div');
    var h=document.createElement('h3');h.textContent=r.title;
    var a=document.createElement('div');a.className='a';a.textContent=[r.artist,r.year].filter(Boolean).join(' \u00B7 ');
    info.appendChild(h);info.appendChild(a);
    if(r.genre){var ge=document.createElement('div');ge.className='g';ge.textContent=r.genre;info.appendChild(ge)}
    if(r.box){var ch=document.createElement('span');ch.className='chip';ch.textContent='Box '+r.box;info.appendChild(ch)}
    if(r.comment){var cm=document.createElement('div');cm.className='cm';cm.textContent=r.comment;info.appendChild(cm)}
    top.appendChild(big);top.appendChild(info);body.appendChild(top);
    var tl=document.createElement('div');tl.className='tl';
    var th=document.createElement('h4');th.textContent='Tracklist';tl.appendChild(th);
    var st=document.createElement('div');st.className='a';st.textContent='Looking up the tracklist\u2026';tl.appendChild(st);
    body.appendChild(tl);
    if(rnd){var pb=document.createElement('button');pb.type='button';pb.className='cta pick';pb.textContent='Pick another';pb.onclick=pickRandom;body.appendChild(pb)}
    var hint=document.createElement('div');hint.className='fhint';
    hint.textContent='Cover file: '+decodeURIComponent(coverFile(r).slice(COVER_DIR.length));
    body.appendChild(hint);
    if(!dlg.open)dlg.showModal();
    dlg.scrollTop=0;
    getTracks(r).then(function(res){
      if(openFor!==r)return;
      tl.removeChild(st);
      if(!res){
        var p=document.createElement('div');p.className='a';
        p.appendChild(document.createTextNode('No tracklist found automatically. '));
        var l=document.createElement('a');l.target='_blank';l.rel='noopener';
        l.href='https://www.discogs.com/search/?type=release&q='+encodeURIComponent(r.artist+' '+r.title);
        l.textContent='Search on Discogs';p.appendChild(l);tl.appendChild(p);return;
      }
      var multi=res.tracks.some(function(t){return t.disc>1}),lastDisc=0;
      res.tracks.forEach(function(t){
        if(multi&&t.disc!==lastDisc){lastDisc=t.disc;var dd=document.createElement('div');dd.className='disc';dd.textContent='Disc '+t.disc;tl.appendChild(dd)}
        var row=document.createElement('div');row.className='trk';
        var n=document.createElement('span');n.className='n';n.textContent=t.no||'';
        var nm=document.createElement('span');nm.className='nm';nm.textContent=t.name;
        var d=document.createElement('span');d.className='d';d.textContent=fmtMs(t.ms);
        row.appendChild(n);row.appendChild(nm);row.appendChild(d);tl.appendChild(row);
      });
      var src=document.createElement('div');src.className='src';
      src.textContent='Source: '+res.source+'. Your pressing may differ slightly (bonus tracks, edition).';
      tl.appendChild(src);
    });
  }

  function render(){
    var q=txt($('q').value.trim()),box=$('boxSel').value,genre=$('genreSel').value,sort=$('sortSel').value;
    var list=records.filter(function(r){
      if(box&&r.box!==box)return false;
      if(genre&&r.genre!==genre)return false;
      return !q||txt(r.artist).indexOf(q)>=0||txt(r.title).indexOf(q)>=0||txt(r.genre).indexOf(q)>=0||txt(r.comment).indexOf(q)>=0;
    });
    list.sort(function(a,b){
      if(sort==='box'){var c=bnum(a.box)-bnum(b.box);if(c)return c}
      if(sort==='year'){var d=(parseInt(a.year)||0)-(parseInt(b.year)||0);if(d)return d}
      if(sort==='title')return txt(a.title).localeCompare(txt(b.title));
      return txt(a.artist).localeCompare(txt(b.artist))||(parseInt(a.year)||0)-(parseInt(b.year)||0);
    });
    $('count').textContent=list.length+(list.length===records.length?'':' of '+records.length)+' records';
    var g=$('grid');g.innerHTML='';var lastBox=null;
    list.forEach(function(r){
      if(sort==='box'&&r.box!==lastBox){lastBox=r.box;var h=document.createElement('h2');h.textContent='Box '+r.box;g.appendChild(h)}
      var c=document.createElement('div');c.className='card';
      var cv=document.createElement('div');cv.className='cover';cv.textContent='\u25CE';
      var im=document.createElement('img');im.loading='lazy';im.alt='Cover of '+r.title;setCover(im,r,function(){im.remove()});
      cv.appendChild(im);
      c.appendChild(cv);
      var m=document.createElement('div');m.className='meta';
      var t=document.createElement('div');t.className='t';t.textContent=r.title;
      var a=document.createElement('div');a.className='a';a.textContent=[r.artist,r.year].filter(Boolean).join(' \u00B7 ');
      m.appendChild(t);m.appendChild(a);
      if(r.genre){var ge=document.createElement('div');ge.className='g';ge.textContent=r.genre;m.appendChild(ge)}
      if(r.comment){var cm=document.createElement('div');cm.className='cm';cm.textContent=r.comment;m.appendChild(cm)}
      c.appendChild(m);
      c.tabIndex=0;c.setAttribute('role','button');
      c.onclick=function(){openAlbum(r)};
      c.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openAlbum(r)}};
      g.appendChild(c);
    });
    $('empty').hidden=list.length>0;
  }
  ['q','boxSel','genreSel','sortSel'].forEach(function(id){$(id).addEventListener('input',render)});

  records=toRecords(SNAPSHOT.map(function(r){return r.slice()}));
  $('foot').textContent='Loading the spreadsheet\u2026';
  buildFilters();render();buildHome();route();

  function gvizRows(d){
    return (d.table.rows||[]).map(function(row){
      var c=row.c||[],out=[];
      for(var i=0;i<8;i++){
        var v=c[i]&&c[i].v!=null?c[i].v:'';
        if(typeof v==='string'&&/^Date\(/.test(v)){var m=v.match(/Date\((\d+),(\d+),(\d+)/);v=m?m[1]+'-'+(+m[2]+1)+'-'+m[3]:''}
        out.push(String(v));
      }
      return out;
    });
  }
  function loadGviz(){
    return new Promise(function(res,rej){
      var cb='gv'+Date.now(),s=document.createElement('script');
      var timer=setTimeout(function(){done();rej(new Error('timeout'))},15000);
      function done(){clearTimeout(timer);delete window[cb];s.remove()}
      window[cb]=function(d){done();try{res(toRecords(gvizRows(d)))}catch(e){rej(e)}};
      s.onerror=function(){done();rej(new Error('load'))};
      s.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?gid=0&headers=1&tqx=out:json;responseHandler:'+cb;
      document.head.appendChild(s);
    });
  }
  function loadSheet(){
    return fetch(CSV_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
      .then(function(t){return toRecords(parseCSV(t.replace(/^\uFEFF/,'')))})
      .catch(loadGviz);
  }
  loadSheet().then(function(live){
    if(!live.length)throw new Error('empty');
    records=live;buildFilters();render();buildHome();buildNew(true);
    $('foot').textContent=records.length+' records \u00B7 live from the spreadsheet';
  }).catch(function(){
    $('foot').textContent='';
    buildNew(false);
  });
})();
</script>
</body>
</html>
